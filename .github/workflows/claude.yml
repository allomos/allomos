# Lets anyone with write access ask Claude for help on GitHub (Task-A07-20): write @claude in an
# issue, a pull request, or a review comment, and Claude answers there; it can also change code on
# a new branch and open a pull request. It runs anthropics/claude-code-action on GitHub's standard
# runner (the repository is public, so the runner costs no minutes). Claude's usage is billed to
# the approver through the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`); an
# ANTHROPIC_API_KEY secret works instead. Needs the Claude GitHub App installed on the allomos
# organization. Runs only from the default branch, so it takes effect once merged into main.
# Cleanup when no longer needed: delete this file, the secret, and the app installation.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Only when the text mentions @claude, so other comments start nothing.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
