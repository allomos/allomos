[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.31"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
allomos-core = { path = "crates/core" }
allomos-store = { path = "crates/store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Development builds keep only file and line numbers for crash reports, not full
# debugger information: smaller target/ folders and faster linking. See
# docs/workflow/CODING_RULES.md § Build output.
[profile.dev]
debug = "line-tables-only"
