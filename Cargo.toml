[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
glidebox-core = { path = "crates/core" }
glidebox-store = { path = "crates/store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
