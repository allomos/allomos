[package]
name = "allomos-store"
description = "Reads and creates taskbages on disk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
allomos-core.workspace = true
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
# Signed events (Task-A01-gusto404, decision 0021 § 3.1): Ed25519 signatures from the version the
# lockfile already had (the desktop app's TLS uses it), and SHA-256 as allomos-core has it.
ring = "=0.17.14"
sha2 = "=0.10.9"

# Windows: the signing key in the Credential Manager (Task-A01-ring220), from the version the
# lockfile already has.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[features]
# Tests only: never read or write the person's real settings folder for pseudonyms and session
# models unless a test chose one with ALLOMOS_SETTINGS_DIR (Task-A01-black004). Turned on by the
# app's dev-dependencies, so a release build never has it.
test-settings = []

[dev-dependencies]
# Its own tests too never use the person's Keychain or settings folder unless a test chose one
# with ALLOMOS_SETTINGS_DIR (Task-A01-gusto404).
allomos-store = { path = ".", features = ["test-settings"] }
