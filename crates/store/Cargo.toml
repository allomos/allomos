[package]
name = "allomos-store"
description = "Reads and creates taskbages on disk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
allomos-core.workspace = true
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true

[features]
# Tests only: never read or write the person's real settings folder for pseudonyms and session
# models unless a test chose one with ALLOMOS_SETTINGS_DIR (Task-A01-black004). Turned on by the
# app's dev-dependencies, so a release build never has it.
test-settings = []
