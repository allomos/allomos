[package]
name = "allomos-monitor"
description = "Monitor ready tasks: the loop, its run files and the terminal sessions it starts, shared by alm and the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
allomos-core.workspace = true
allomos-store.workspace = true
# Each run's lock (Task-A03-cow112): the same pinned version the store's taskbag lock uses.
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true

# A run started in the background gets a session of its own (`setsid`), and a run whose record is
# missing is ended with `kill`: the version already in Cargo.lock, pinned deliberately.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
allomos-store = { workspace = true, features = ["test-settings"] }
