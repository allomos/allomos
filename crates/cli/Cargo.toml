[package]
name = "allomos-cli"
description = "The allomos / alm command: agents and people work a taskbag's tasks from a terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# One program under two names: `allomos` and the short `alm` (R88).
[[bin]]
name = "allomos"
path = "src/bin/allomos.rs"

[[bin]]
name = "alm"
path = "src/bin/alm.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }
allomos-core.workspace = true
allomos-store.workspace = true
serde.workspace = true
serde_json.workspace = true
# The computer's languages for `alm task-language` before the app has run (Task-A01-21); the
# same pinned version as the desktop app.
sys-locale = "=0.3.2"

[dev-dependencies]
allomos-core.workspace = true
allomos-store.workspace = true
